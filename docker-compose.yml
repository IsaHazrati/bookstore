services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # اجزای جدا به‌جای DATABASE_URL: رمز با هر کاراکتری درست escape می‌شود
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      USE_X_ACCEL: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SHIPPING_FEE_RIAL: ${SHIPPING_FEE_RIAL:-0}
      PAYMENT_CARD_NUMBER: ${PAYMENT_CARD_NUMBER:-}
      PAYMENT_CARD_HOLDER: ${PAYMENT_CARD_HOLDER:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  storefront:
    build: ./storefront
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      SITE_URL: ${SITE_URL}
    depends_on:
      - backend

  admin:
    build: ./admin
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # فقط‌خواندنی: nginx فایل‌های دیجیتال را بعد از X-Accel-Redirect سرو می‌کند
      - uploads:/data/uploads:ro
    depends_on:
      - storefront
      - admin
      - backend

volumes:
  pgdata:
  uploads:
