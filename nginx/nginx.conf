# سقف آپلود کمی بیشتر از سقف برنامه (۱۰۰MB فایل دیجیتال)
client_max_body_size 110m;

# فروشگاه: bookstore.localhost
server {
  listen 80;
  server_name bookstore.localhost;

  # API مدیریت هرگز از دامنه‌ی عمومی در دسترس نیست
  location /api/admin/ {
    return 404;
  }

  location /media/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://storefront:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# پنل مدیریت: admin.bookstore.localhost
server {
  listen 80;
  server_name admin.bookstore.localhost;

  # در production: allowlist آی‌پی یا Basic Auth اینجا اضافه می‌شود
  # allow 1.2.3.4; deny all;

  location /media/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://admin:80;
    proxy_set_header Host $host;
  }
}
