# ---------------------------------------------------------------------------
# تنظیمات عمومی (داخل بلاک http فایل اصلی nginx include می‌شود)
# ---------------------------------------------------------------------------

# سقف آپلود کمی بیشتر از سقف برنامه (۱۰۰MB فایل دیجیتال)
client_max_body_size 110m;
server_tokens off;

# DNS داخلی داکر. نام سرویس‌ها در متغیر نگه داشته می‌شوند تا هر ۱۰ ثانیه دوباره resolve شوند؛
# بدون این، بعد از rebuild یک کانتینر (و عوض شدن IP آن) nginx تا ری‌استارت خطای 502 می‌داد.
resolver 127.0.0.11 valid=10s ipv6=off;

# محدودیت درخواست ورود/ثبت‌نام به‌ازای هر IP (جلوگیری از حدس رمز و سیل هش Argon2).
# عمداً سخت‌گیر نیست، چون در ایران کاربران زیادی پشت یک IP مشترک (CGNAT) هستند.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript
           application/xml application/rss+xml application/ld+json image/svg+xml;

# هدرهای پروکسی (در همه‌ی locationها به ارث می‌رسند)
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ---------------------------------------------------------------------------
# درخواست با Host ناشناخته (اسکن با IP، دامنه‌های جعلی): بدون پاسخ بسته می‌شود
# ---------------------------------------------------------------------------
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

# ---------------------------------------------------------------------------
# فروشگاه: bookstore.localhost
# ---------------------------------------------------------------------------
server {
  listen 80;
  server_name bookstore.localhost;

  set $backend http://backend:8000;
  set $storefront http://storefront:3000;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # بعد از راه‌اندازی HTTPS فعال شود (روی HTTP بی‌اثر است و قبل از آماده بودن TLS خطرناک):
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # API مدیریت هرگز از دامنه‌ی عمومی در دسترس نیست
  location /api/admin/ {
    return 404;
  }

  # فایل‌های دیجیتال: فقط با X-Accel-Redirect از بک‌اند (بعد از بررسی لینک امضاشده) قابل دسترسی است.
  # درخواست مستقیم به این مسیر 404 می‌گیرد (internal). nginx خودش Range/ادامه‌ی دانلود را پشتیبانی می‌کند.
  location /_protected/digital/ {
    internal;
    alias /data/uploads/digital/;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "private, no-store" always;
  }

  # کاورها نام تصادفی و تغییرناپذیر دارند؛ کش طولانی امن است
  location /media/ {
    expires 1y;
    proxy_pass $backend;
  }

  location ~ ^/api/v1/auth/(login|register)$ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass $backend;
  }

  location /api/ {
    proxy_pass $backend;
  }

  location / {
    proxy_pass $storefront;
  }
}

# ---------------------------------------------------------------------------
# پنل مدیریت: admin.bookstore.localhost
# ---------------------------------------------------------------------------
server {
  listen 80;
  server_name admin.bookstore.localhost;

  # در production: allowlist آی‌پی یا Basic Auth اینجا اضافه می‌شود
  # allow 1.2.3.4; deny all;

  set $backend http://backend:8000;
  set $admin http://admin:80;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  # پنل فقط اسکریپت و استایل خودش را اجرا می‌کند؛ هیچ منبع خارجی و هیچ iframe مجاز نیست
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  location /media/ {
    expires 1y;
    proxy_pass $backend;
  }

  location ~ ^/api/v1/auth/(login|register)$ {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass $backend;
  }

  location /api/ {
    proxy_pass $backend;
  }

  location / {
    proxy_pass $admin;
  }
}
